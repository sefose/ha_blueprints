blueprint:
  name: "Hue Schalter (Z2M) - Licht Aus & Szenen-Schalter (Original)"
  description: "Taste 1 schaltet sofort AUS. Taste 4 schaltet durch belibig viele Szenen."
  domain: automation
  input:
    hue_device:
      name: Hue Schalter
      description: "Wähle das Hue Schalter Gerät aus"
      selector:
        device:
          integration: mqtt
    light_target:
      name: Ziel (Licht oder Raum)
      description: "Das Licht oder der Raum, der ausgeschaltet werden soll"
      selector:
        target:
          entity:
            domain: light
    scene_list:
      name: Szenen-Liste
      description: "Wähle beliebig viele Szenen aus"
      selector:
        entity:
          domain: scene
          multiple: true
    reset_timeout:
      name: Reset-Zeitfenster (Sekunden)
      default: 10
      selector:
        number:
          min: 2
          max: 300
          unit_of_measurement: "s"

mode: restart
max_exceeded: silent

trigger:
  # --- Taste 1 (Oben) ---
  - platform: device
    domain: mqtt
    device_id: !input hue_device
    type: action
    subtype: on_press
    id: taste_1

  # --- Taste 4 (Unten) ---
  - platform: device
    domain: mqtt
    device_id: !input hue_device
    type: action
    subtype: hue_press
    id: taste_4

  - platform: device
    domain: mqtt
    device_id: !input hue_device
    type: action
    subtype: off_press
    id: taste_4

action:
  - choose:
      # --- AKTION FÜR TASTE 1: LICHT AUS ---
      - conditions:
          - condition: trigger
            id: taste_1
        sequence:
          - action: light.turn_off
            target: !input light_target

      # --- AKTION FÜR TASTE 4: SZENEN DURCHSCHALTEN ---
      - conditions:
          - condition: trigger
            id: taste_4
        sequence:
          - repeat:
              for_each: !input scene_list
              sequence:
                # 1. Szene aktivieren
                - action: scene.turn_on
                  target:
                    entity_id: "{{ repeat.item }}"

                # 2. Warten auf NÄCHSTEN Druck auf Taste 4
                - wait_for_trigger:
                    - platform: device
                      domain: mqtt
                      device_id: !input hue_device
                      type: action
                      subtype: hue_press
                    - platform: device
                      domain: mqtt
                      device_id: !input hue_device
                      type: action
                      subtype: off_press
                  timeout:
                    seconds: !input reset_timeout
                  continue_on_timeout: false