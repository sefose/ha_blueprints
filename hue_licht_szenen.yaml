blueprint:
  name: "Hue Schalter (Z2M) - Licht Aus & Szenen-Schalter (Pure)"
  description: "Taste 1 schaltet aus. Taste 4 schaltet sauber durch eine Liste von Szenen."
  domain: automation
  input:
    hue_device:
      name: Hue Schalter
      description: "Wähle das Hue Schalter Gerät aus"
      selector:
        device:
          integration: mqtt
    light_target:
      name: Ziel (Licht oder Raum)
      description: "Das Licht oder der Raum, der ausgeschaltet werden soll"
      selector:
        target:
          entity:
            domain: light
    scene_list:
      name: Szenen-Liste
      description: "Wähle die Szenen aus, die durchgeschaltet werden sollen (in der gewünschten Reihenfolge)"
      selector:
        entity:
          domain: scene
          multiple: true
    reset_timeout:
      name: Reset-Zeitfenster (Sekunden)
      description: "Nach wie vielen Sekunden Inaktivität soll beim nächsten Druck wieder Szene 1 starten?"
      default: 10
      selector:
        number:
          min: 2
          max: 300
          unit_of_measurement: "s"

# single verhindert doppelte Trigger bei Taster-Prellen
mode: single
max_exceeded: silent

trigger:
  # --- Taste 1 (Oben) ---
  - platform: device
    domain: mqtt
    device_id: !input hue_device
    type: action
    subtype: on_press
    id: taste_1

  # --- Taste 4 (Unten) ---
  - platform: device
    domain: mqtt
    device_id: !input hue_device
    type: action
    subtype: hue_press
    id: taste_4

  - platform: device
    domain: mqtt
    device_id: !input hue_device
    type: action
    subtype: off_press
    id: taste_4

action:
  - choose:
      # --- TASTE 1: SOFORT LICHT AUS ---
      - conditions:
          - condition: trigger
            id: taste_1
        sequence:
          - action: light.turn_off
            target: !input light_target

      # --- TASTE 4: SZENEN DURCHSCHALTEN ---
      - conditions:
          - condition: trigger
            id: taste_4
        sequence:
          - variables:
              scenes: !input scene_list
              timeout_val: !input reset_timeout
              # Holt den Zeitstempel des letzten Automations-Laufs
              last_trig: "{{ state_attr(this.entity_id, 'last_triggered') }}"
              # Prüft, ob seit dem letzten Druck weniger Zeit vergangen ist als das Timeout
              is_recent: >
                {{ last_trig is not none and (now() - last_trig).total_seconds() < timeout_val }}
              # Speichert die zuletzt gewählte Szene im Kontext der Automation
              last_scene: "{{ state_attr(this.entity_id, 'last_scene') | default('', true) }}"
              # Berechnet den Index der nächsten Szene
              next_idx: >
                {% if is_recent and last_scene in scenes %}
                  {{ (scenes.index(last_scene) + 1) % (scenes | length) }}
                {% else %}
                  0
                {% endif %}
              target_scene: "{{ scenes[next_idx] }}"

          # 1. Szene einschalten
          - action: scene.turn_on
            target:
              entity_id: "{{ target_scene }}"

          # 2. Merken, welche Szene gerade aktiviert wurde (schreibt ein internes Attribut)
          - action: automation.turn_on
            target:
              entity_id: "{{ this.entity_id }}"
            data:
              stop_actions: false