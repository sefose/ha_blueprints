blueprint:
  name: "Hue Schalter (Z2M) - Licht Aus & Szenen-Schalter (Dynamisch)"
  description: "Taste 1 schaltet sofort AUS. Taste 4 schaltet durch eine beliebige Liste von Szenen."
  domain: automation
  input:
    hue_device:
      name: Hue Schalter
      description: "Wähle das Hue Schalter Gerät aus"
      selector:
        device:
          integration: mqtt
    light_target:
      name: Ziel (Licht oder Raum)
      description: "Das Licht oder der Raum, der ausgeschaltet werden soll"
      selector:
        target:
          entity:
            domain: light
    scene_list:
      name: Szenen-Liste
      description: "Wähle belibig viele Szenen aus (in der gewünschten Reihenfolge)"
      selector:
        entity:
          domain: scene
          multiple: true
    reset_timeout:
      name: Reset-Zeitfenster (Sekunden)
      description: "Nach wie vielen Sekunden Inaktivität soll beim nächsten Druck wieder Szene 1 starten?"
      default: 10
      selector:
        number:
          min: 2
          max: 300
          unit_of_measurement: "s"

# restart erlaubt es Taste 1, die Szenen-Schleife AUGENBLICKLICH zu beenden
mode: restart
max_exceeded: silent

trigger:
  # --- Taste 1 (Oben / An) ---
  - platform: device
    domain: mqtt
    device_id: !input hue_device
    type: action
    subtype: on_press
    id: taste_1

  # --- Taste 4 (Unten / Aus) ---
  - platform: device
    domain: mqtt
    device_id: !input hue_device
    type: action
    subtype: hue_press
    id: taste_4

  - platform: device
    domain: mqtt
    device_id: !input hue_device
    type: action
    subtype: off_press
    id: taste_4

action:
  - choose:
      # --- TASTE 1: SOFORT AUSSCHALTEN ---
      - conditions:
          - condition: trigger
            id: taste_1
        sequence:
          - action: light.turn_off
            target: !input light_target

      # --- TASTE 4: SZENEN DURCHSCHALTEN ---
      - conditions:
          - condition: trigger
            id: taste_4
        sequence:
          - repeat:
              for_each: !input scene_list
              sequence:
                # 1. Szene aus der Liste aktivieren
                - action: scene.turn_on
                  target:
                    entity_id: "{{ repeat.item }}"

                # 2. Warten auf den NÄCHSTEN Druck auf Taste 4 ODER Ausschalten durch Taste 1
                - wait_for_trigger:
                    - platform: device
                      domain: mqtt
                      device_id: !input hue_device
                      type: action
                      subtype: hue_press
                    - platform: device
                      domain: mqtt
                      device_id: !input hue_device
                      type: action
                      subtype: off_press
                    - platform: device
                      domain: mqtt
                      device_id: !input hue_device
                      type: action
                      subtype: on_press
                  timeout:
                    seconds: !input reset_timeout
                  continue_on_timeout: false

                # 3. Wenn Taste 1 während des Wartens gedrückt wurde -> Licht aus & Schleife stoppen!
                - if:
                    - condition: template
                      value_template: >
                        {{ wait.trigger is not none and wait.trigger.event.data.type == 'on_press' }}
                  then:
                    - action: light.turn_off
                      target: !input light_target
                    - stop: "Ausgeschaltet mit Taste 1"